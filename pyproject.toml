[project]
name = "ha-automation-mcp"
version = "0.3.0"
description = "MCP server for the Home Assistant Automation API custom component"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[project.scripts]
ha-automation-mcp = "server:main"
